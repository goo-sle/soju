name: Update soju news clippings

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST(전날 21:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch news and patch guide.html
        run: python .github/scripts/update_news_clippings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "guide.html: 소주 뉴스 클리핑 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi

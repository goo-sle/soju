<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>페이지를 찾을 수 없어요 | 대한민국 소주 가이드</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- GitHub Pages가 없는 주소 전부에 보여주는 페이지. 자동 이동은 넣지 않음(캐시된 옛 리다이렉트와 서로 넘기는 루프 방지) — 링크는 어느 경로에서 열려도 되게 / 로 시작 -->
<style>
:root{--ink:#252A33;--muted:#5F6672;--line:#DDE3EC;--bg:#F4F6F8;--brand:#22408C;--brand-2:#2F57B0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",sans-serif;line-height:1.7;word-break:keep-all}
.gnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 20px;border-bottom:1px solid var(--line)}
.gnav-brand{font-family:"Hahmlet",serif;font-weight:700;font-size:18px;color:var(--brand);text-decoration:none}
.gnav-links{display:flex;flex-wrap:wrap;gap:6px 22px}
.gnav-links a{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 2px}
main{max-width:560px;margin:0 auto;padding:72px 20px;text-align:center}
.code{font-family:"Hahmlet",serif;font-weight:300;font-size:72px;line-height:1;color:var(--brand)}
h1{font-family:"Hahmlet",serif;font-weight:500;font-size:24px;margin:16px 0 8px}
p{color:var(--muted);margin:0 0 28px}
.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}
.btn:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px}
</style>
</head>
<body>
<header class="gnav">
<a class="gnav-brand" href="/">대한민국 소주 가이드</a>
<nav class="gnav-links"><a href="/#browse">둘러보기</a><a href="/#quickindex">빠른 찾기</a><a href="/#region">지역별 브랜드</a><a href="/#timeline">소주 백과</a><a href="/#news">소식·퀴즈</a></nav>
</header>
<main>
<div class="code">404</div>
<h1>찾는 페이지가 없어요</h1>
<p>주소가 바뀌었거나 없어진 페이지예요. 예전 주소 /guide는 이제 메인(/)이에요.</p>
<a class="btn" href="/">소주 가이드 메인으로</a>
</main>
</body>
</html>
